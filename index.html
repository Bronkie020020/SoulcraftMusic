<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
    <title>Soulcraft Downloader - High-Fidelity Music Downloader</title>
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Soulcraft Downloader - Download, beheer en organiseer muziek van Spotify, SoundCloud & YouTube Music in hoge kwaliteit (320kbps MP3 / FLAC / WAV / M4A)." />
    
    <script>
      // Immediately unregister any legacy service workers and clear caches
      if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
        try {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          });
        } catch (e) {}
      }
      if (typeof window !== 'undefined' && 'caches' in window) {
        try {
          caches.keys().then(function(names) {
            for (var i = 0; i < names.length; i++) {
              caches.delete(names[i]);
            }
          });
        } catch (e) {}
      }
    </script>

    <!-- iOS / Apple Web App Capabilities & High-Res Icons -->
